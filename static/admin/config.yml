backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Articles"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title", "author", "pillar", "language"]
    view_filters:
      - label: "Marc"
        field: author
        pattern: "Marc"
      - label: "Linda"
        field: author
        pattern: "Linda"
      - label: "English"
        field: language
        pattern: "en"
      - label: "Français"
        field: language
        pattern: "fr"
      - label: "Featured"
        field: featured
        pattern: true
    view_groups:
      - label: "Pillar"
        field: pillar
      - label: "Language"
        field: language
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "Short summary for previews and SEO (1-2 sentences)" }
      - label: "Author"
        name: "author"
        widget: "select"
        options:
          - { label: "Marc", value: "Marc" }
          - { label: "Linda", value: "Linda" }
          - { label: "Marc & Linda", value: "Marc & Linda" }
        default: "Marc"
      - label: "Language"
        name: "language"
        widget: "select"
        options:
          - { label: "English", value: "en" }
          - { label: "Français", value: "fr" }
        default: "en"
        hint: "Primary language of this article"
      - label: "Pillar"
        name: "pillar"
        widget: "select"
        options:
          - { label: "The Choice — Life decisions", value: "choice" }
          - { label: "The Gaze — Understanding places", value: "gaze" }
          - { label: "Behind the Scenes — Nomad logistics", value: "scenes" }
          - { label: "Body in Motion — Sport & travel", value: "motion" }
          - { label: "Linda's Words — Literary voice", value: "words" }
        required: false
        hint: "Which content pillar does this belong to?"
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Keywords separated by commas (e.g. Switzerland, ultratrail, New York)"
      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "Where was this written? (e.g. Boulder, CO / Queens, NYC / Medellín)"
      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "Optional cover image for the article"
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured articles appear larger on the homepage"
      - label: "Substack URL"
        name: "substack_url"
        widget: "string"
        required: false
        hint: "Link to the Substack version of this article"
      - label: "YouTube URL"
        name: "youtube_url"
        widget: "string"
        required: false
        hint: "Link to a related YouTube video"
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
